name: Discover Explorer Candidates

on:
  schedule:
    - cron: '0 4 * * 1'    # Mondays 04:00 UTC — runs after nightly fetch
  workflow_dispatch:        # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Discover candidates
        env:
          BGG_BEARER_TOKEN: ${{ secrets.BGG_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/explorer_discover.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/explorer_candidates.json data/explorer_cache.json
          git diff --staged --quiet || git commit -m "Update Explorer candidates $(date -u +%Y-%m-%d)"
          git push
