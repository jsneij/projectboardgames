name: Refresh BGG Awards

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC, after Explorer cron
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Refresh awards
        env:
          BGG_BEARER_TOKEN: ${{ secrets.BGG_BEARER_TOKEN }}
        run: python scripts/fetch_bgg_awards.py --min-year 2010
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bgg_awards.json data/bgg_awards_cache.json
          git diff --staged --quiet || git commit -m "Update BGG awards $(date -u +%Y-%m-%d)"
          git push
